<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Yasmine & Ziad Wedding</title>
  <style>
    :root {
      --bg: #f4efe6;
      --card: rgba(255,255,255,0.72);
      --text: #2f3328;
      --muted: #777468;
      --olive: #6f7555;
      --olive-dark: #565c40;
      --line: rgba(47,51,40,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 34%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 42px 28px 32px;
      text-align: center;
      box-shadow: 0 16px 50px rgba(70, 66, 50, 0.08);
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 9vw, 52px);
      line-height: 1.05;
      font-weight: 500;
    }

    .divider {
      width: 54px;
      height: 1px;
      background: var(--olive);
      margin: 24px auto;
      opacity: .65;
    }

    .venue {
      font-size: 19px;
      margin: 0 0 6px;
    }

    .location {
      margin: 0 0 30px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: var(--muted);
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    a.button {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease;
    }

    a.button:active {
      transform: scale(.985);
    }

    .primary {
      background: var(--olive);
      color: #fff;
    }

    .primary:hover {
      background: var(--olive-dark);
    }

    .secondary {
      color: var(--olive-dark);
      border: 1px solid rgba(86,92,64,.28);
      background: rgba(255,255,255,.52);
    }

    .secondary:hover {
      background: rgba(255,255,255,.82);
    }

    footer {
      margin-top: 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #969185;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Lieu du mariage</div>
    <h1>Yasmine &amp; Ziad</h1>
    <div class="divider"></div>

    <p class="venue">Dar Tillili</p>
    <p class="location">Marrakech, Maroc</p>

    <div class="buttons">
      <a
        class="button primary"
        href="https://maps.app.goo.gl/R6Fe5PCkukmVFrSG8"
        target="_blank"
        rel="noopener noreferrer"
      >
        Ouvrir dans Google Maps
      </a>

      <a
        class="button secondary"
        href="https://www.waze.com/ul?ll=31.498361,-7.855722&amp;navigate=yes"
        target="_blank"
        rel="noopener noreferrer"
      >
        Ouvrir dans Waze
      </a>
    </div>

    <footer>Nous avons hâte de célébrer ce moment avec vous.</footer>
  </main>
</body>
</html>
